[project]
name = "kanidm-discord-bot"
version = "2026.11.0"
description = "Discord bot for Kanidm user registration"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite~=0.22",
    "discord.py~=2.7",
    "httpx~=0.28",
    "python-dotenv~=1.2",
]

[dependency-groups]
dev = [
    "pytest~=8.4",
    "ruff~=0.14",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
